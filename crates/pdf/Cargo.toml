[package]
name = "gridcraft-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GridCraft's PDF writer for print and PDF export (vector drawing, text, RGBA images, links)"

[lints]
workspace = true

[dependencies]
# Guarded krilla authoring. The root manifest patches krilla to the same revision.
craft-pdf = { git = "https://github.com/storytold/craft-libs", rev = "9f75d3dc19b4b514c4f3d4847ed1ec1b0e86b4ef", version = "=0.1.0", default-features = false, features = ["write"] }
thiserror = { workspace = true }

[dev-dependencies]
# Reads written PDFs back in tests. The root manifest patches hayro-syntax to the same revision.
craft-pdf = { git = "https://github.com/storytold/craft-libs", rev = "9f75d3dc19b4b514c4f3d4847ed1ec1b0e86b4ef", version = "=0.1.0", default-features = false, features = ["write", "read"] }
